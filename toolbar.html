<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Recorder Toolbar</title>
    <style>
      :root {
        --bg: rgba(15, 28, 46, 0.9);
        --panel: rgba(19, 39, 66, 0.9);
        --accent: #f2c14e;
        --text: #f5f7fb;
      }
      body {
        margin: 0;
        padding: 6px 8px;
        background: var(--bg);
        color: var(--text);
        font-family: "DM Sans", "Trebuchet MS", sans-serif;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }
      .row {
        display: flex;
        gap: 6px;
      }
      button {
        background: var(--panel);
        color: var(--text);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 6px 10px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 12px;
      }
      button.primary {
        background: var(--accent);
        color: #1b1b1b;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <button class="primary" id="recordBtn">Record</button>
      <button id="pauseBtn">Pause</button>
      <button id="stopBtn">Stop</button>
    </div>
    <script src="toolbar.js"></script>
  </body>
</html>
